# kitty.conf — X11 profile matched to previous Wayland settings
# Wayland backup: kitty.conf.wayway
# Theme: Tokyo Night (background_opacity controlled here, not in theme)
#
# Performance notes vs Wayland profile:
#   - linux_display_server x11
#   - cursor_trail off (was animated / expensive)
#   - opaque background (was 0.6 + dynamic opacity)
#   - background_blur remains 0
#   - no wayland_titlebar_color

include current-theme.conf

# BEGIN_KITTY_FONTS
font_family      family="ProFont IIx Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

font_size 15.0
disable_ligatures never

# Display server
linux_display_server x11

# Colors (override theme slightly, as before)
foreground #dddddd
background #332539
cursor #cccccc
cursor_text_color #111111
active_border_color #cccccc

# Cursor — no trail animation (resource-heavy)
cursor_shape block
cursor_beam_thickness 0.25
cursor_underline_thickness 1.0
cursor_trail 0

# Window / chrome — solid, no transparency stack
background_opacity 1.0
background_blur 0
dynamic_background_opacity no
hide_window_decorations titlebar-only
window_border_width 5.5pt
# Later values from original conf won over earlier duplicates
window_margin_width 0
single_window_margin_width -1
window_padding_width 4
single_window_padding_width -1
placement_strategy center
visual_window_select_characters 1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ

# Tabs
tab_bar_edge top
tab_bar_align center
tab_bar_style separator
tab_separator " • "
tab_bar_margin_height 0.0 0.0
tab_title_max_length 30
tab_title_template "{index}: {title.split(' ')[0]}"
macos_menubar_title_max_length 20

# Scrollback / scrollbar
scrollback_lines 2000
scrollbar scrolled
scrollbar_interactive yes
scrollbar_jump_on_click yes
scrollbar_width 0.5
scrollbar_hover_width 1
scrollbar_track_color foreground
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# Input / misc
mouse_hide_wait 3.0
copy_on_select no
clear_selection_on_clipboard_loss no
sync_to_monitor yes
enable_audio_bell no
shell_integration enabled
editor nvim
kitty_mod ctrl+shift

# Remote control + scrollback plugin
allow_remote_control socket-only
listen_on unix:/tmp/kitty
listen_on unix:@mykitty
action_alias kitty_scrollback_nvim kitten '/home/neeto/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py'

# ── Maps ──────────────────────────────────────────────────────────────

# Smart splits / nvim passthrough
map ctrl+g kitten hints --type=linenum --linenum-action=tab nvim +{line} {path}
map ctrl+j neighboring_window down
map ctrl+k neighboring_window up
map ctrl+h neighboring_window left
map ctrl+l neighboring_window right
map --when-focus-on var:IS_NVIM ctrl+j
map --when-focus-on var:IS_NVIM ctrl+k
map --when-focus-on var:IS_NVIM ctrl+h
map --when-focus-on var:IS_NVIM ctrl+l

map alt+j kitten relative_resize.py down  3
map alt+k kitten relative_resize.py up    3
map alt+h kitten relative_resize.py left  3
map alt+l kitten relative_resize.py right 3
map --when-focus-on var:IS_NVIM alt+j
map --when-focus-on var:IS_NVIM alt+k
map --when-focus-on var:IS_NVIM alt+h
map --when-focus-on var:IS_NVIM alt+l

# Tabs
map kitty_mod+' next_tab
map kitty_mod+; previous_tab

# Clipboard / scroll / hints (from your previous maps)
map kitty_mod+c copy_to_clipboard
map cmd+c copy_or_noop
map kitty_mod+v paste_from_clipboard
map cmd+v paste_from_clipboard
map kitty_mod+o pass_selection_to_program
map kitty_mod+k scroll_line_up
map kitty_mod+j scroll_line_down
map kitty_mod+p>f kitten hints --type path --program -
map kitty_mod+p>shift+f kitten hints --type path
map kitty_mod+f1 show_kitty_doc overview
map cmd+k clear_terminal to_cursor active
map kitty_mod+f5 load_config_file

# kitty-scrollback.nvim
map kitty_mod+h kitty_scrollback_nvim
map kitty_mod+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output

# F12 opacity toggle removed (requires dynamic_background_opacity + translucent path).
# Re-enable with: dynamic_background_opacity yes + map f12 remote_control set-background-opacity --toggle 1
